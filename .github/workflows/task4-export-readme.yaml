name: Task 4 - Export README

on:
  workflow_dispatch:
  push:
    paths:
      - tasks/task1-jsonfix/README.md

jobs:
  export:
    runs-on: ubuntu-latest
    container: pandoc/extra:latest   # includes Pandoc + LaTeX
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js + npm
        run: |
            apk add --no-cache nodejs npm npm chromium nss freetype harfbuzz ttf-freefont font-noto
            
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Puppeteer config
        run: |
            cat > puppeteer-config.json <<'JSON'
            { "executablePath": "/usr/bin/chromium",
            "args": ["--no-sandbox","--disable-setuid-sandbox"] }
            JSON

      - name: Render Mermaid → SVG
        run: |
            found=0
            for f in tasks/task1-jsonfix/diagrams/*.mmd; do
                [ -e "$f" ] || continue
                found=1
                out="${f%.*}.svg"
                mmdc -i "$f" -o "$out" -p puppeteer-config.json
                echo "Rendered $f → $out"
            done
            [ "$found" -eq 1 ] || echo "No Mermaid files under diagrams/. Skipping."

      - name: Build DOCX
        run: |
          pandoc tasks/task1-jsonfix/README.md \
            --from=gfm \
            --toc \
            --output=README.docx

      - name: Build PDF
        run: |
          pandoc tasks/task1-jsonfix/README.md \
            --from=gfm \
            --toc \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            --output=README.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readme-exports
          path: |
            README.pdf
            README.docx
