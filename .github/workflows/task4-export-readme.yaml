name: Task 4 - Export README

on:
  workflow_dispatch:
  push:
    paths:
      - tasks/task1-jsonfix/README.md

jobs:
  export:
    runs-on: ubuntu-latest
    container: pandoc/extra:latest   # includes Pandoc + LaTeX
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js + npm
        run: |
            apk add --no-cache nodejs npm
            
      - name: Render Mermaid diagrams
        run: |
            npm install -g @mermaid-js/mermaid-cli
            shopt -s nullglob
            files=(tasks/task1-jsonfix/diagrams/*.mmd)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No Mermaid files found under diagrams/. Skipping."
              exit 0
            fi
            for f in "${files[@]}"; do
              mmdc -i "$f" -o "${f%.mmd}.svg"
              echo "Rendered $f → ${f%.mmd}.svg"
            done

      - name: Build DOCX
        run: |
          pandoc tasks/task1-jsonfix/README.md \
            --from=gfm \
            --toc \
            --output=README.docx

      - name: Build PDF
        run: |
          pandoc tasks/task1-jsonfix/README.md \
            --from=gfm \
            --toc \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            --output=README.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readme-exports
          path: |
            README.pdf
            README.docx
