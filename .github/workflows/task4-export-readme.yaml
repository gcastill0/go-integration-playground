name: Task 4 - Export README

on:
  workflow_dispatch:

jobs:

  render-mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render .mmd → .svg via container
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/mermaid-js/mermaid-cli:latest
          options: -v ${{ github.workspace }}:/work -w /work
          run: |
            shopt -s nullglob
            for f in **/*.mmd; do
              mmdc -i "$f" -o "${f%.mmd}.svg"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: "**/*.svg"

  export:
    runs-on: ubuntu-latest
    container: pandoc/extra:latest   # includes Pandoc + LaTeX
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
            name: diagrams
            path: . 

      - name: Build DOCX
        run: |
          pandoc tasks/task1-jsonfix/README.md \
            --from=gfm \
            --toc \
            --output=README.docx

      - name: Build PDF
        run: |
          pandoc tasks/task1-jsonfix/README.md \
            --from=gfm \
            --toc \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            --output=README.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readme-exports
          path: |
            README.pdf
            README.docx
